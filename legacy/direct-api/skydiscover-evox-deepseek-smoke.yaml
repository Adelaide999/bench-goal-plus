language: python
diff_based_generation: true
max_iterations: 1
checkpoint_interval: 1
max_solution_length: 60000
random_seed: 42

llm:
  api_base: https://api.deepseek.com
  models:
    - name: deepseek/deepseek-v4-flash
      weight: 1.0
  temperature: 0.7
  max_tokens: 16384
  timeout: 600
  retries: 1

search:
  type: evox
  share_llm: true
  switch_interval: 10
  database:
    auto_generate_variation_operators: true

prompt:
  system_message: |
    You are an expert mathematician specializing in circle packing problems and computational geometry.
    Improve a constructor function that directly produces an arrangement of 26 non-overlapping circles
    in a unit square, maximizing the sum of their radii. The AlphaEvolve reference target is 2.635.
    Focus on an explicit deterministic constructor. Respect all boundary and non-overlap constraints.

evaluator:
  timeout: 360
  max_retries: 1
  cascade_evaluation: true
  cascade_thresholds: [0.3, 0.6]

monitor:
  enabled: false

human_feedback_enabled: false

